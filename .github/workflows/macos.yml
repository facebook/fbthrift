name: macos

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions:
  contents: read  #  to fetch code (actions/checkout)
  actions: read  #  to query GitHub Actions cache usage

jobs:
  build:
    runs-on: macOS-latest
    timeout-minutes: 180
    env:
      SCCACHE_GHA_ENABLED: "on"
    steps:

    - uses: actions/checkout@v6

    - name: Set up sccache
      uses: mozilla-actions/sccache-action@v0.0.10
      with:
        version: "v0.14.0"

    # The build fetches the rest, but not the test dependencies.
    - name: Install dependencies
      run: brew install googletest google-benchmark

    - name: Configure
      run: >
        cmake -B _build
        -DCMAKE_BUILD_TYPE=RelWithDebInfo
        -DTHRIFT_TESTS=ON
        -DCMAKE_C_COMPILER_LAUNCHER=sccache
        -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

    # A bare -j starts every ready compile at once. The runner has 7 GB, and
    # getdeps budgets 3 GB per Thrift compile, so two jobs fit.
    - name: Build
      run: cmake --build _build -j 2

    - name: Test
      run: ctest --test-dir _build --output-on-failure

    - name: Show sccache stats
      if: always()
      run: sccache --show-stats
